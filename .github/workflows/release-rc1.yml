# Final release tooling (PQ-27): goreleaser builds the five-target matrix and
# CHECKSUMS-sha256.txt; the attest job pins SLSA provenance on every binary
# (ADR-0003 — unsigned = release-blocker); the publish job runs the release
# gate (PQ-34) as the pre-flight BEFORE any release object is created.
# The reserved 2026.01-rc1 name cuts ONLY from the signed tag ref.
#
# Dispatch modes:
#   publish=false (default): snapshot build + checksums + attestation; run
#     artifacts only, NOTHING published. This is the exercised path.
#   publish=true (dispatched at the signed tag ref, e.g. 2026.01-rc1): the
#     same path plus the gate pre-flight and the release creation.
#     The runner holds no release key: PQSCAN_GATE_SKIP_TAG_VERIFY skips the
#     gate's GPG check — the FULL gate ran green at the key-holding machine
#     before this dispatch (the cut runbook records it in the issue).
# Verify an artifact before running it:
#   gh attestation verify <artifact> -R shsingh/pqscan
name: release-rc1

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (the main.version stamp; 2026.01-rc1 reserved for the milestone cut)'
        required: true
      publish:
        description: 'Create the GitHub release — true only on tag-ref cuts after the local full gate'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: goreleaser matrix + checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: goreleaser (snapshot on test dispatches; forced-tag release on publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '2.18.3'
          # release mode (publish cuts) and snapshot mode (test dispatches)
          # both skip goreleaser's validate + publish + sign stages: the tag
          # is calendar-named not semver, the release OBJECT belongs to the
          # gated publish job below, and provenance is SLSA attestation
          args: ${{ inputs.publish == 'true' && 'release --clean --skip=validate --skip=publish --skip=sign' || 'release --snapshot --clean --skip=validate --skip=publish --skip=sign' }}
        env:
          # deterministic stamp: force the tag to the dispatch input —
          # goreleaser otherwise resolves the NEAREST reachable tag, and an
          # untagged tip silently stamped the previous semver release into
          # the binaries (found in the local publish-mode dry run)
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          CGO_ENABLED: '0'
      - name: Stage flat (the bare-asset contract — a multiline upload path lets
          the action nest per-target dirs into the artifact, which no downstream
          glob then matches)
        run: |
          mkdir -p stage
          cp dist/pqscan_linux_*/pqscan-linux-* stage/
          cp dist/pqscan_darwin_*/pqscan-darwin-* stage/
          cp dist/pqscan_windows_*/pqscan-windows-* stage/
          cp dist/CHECKSUMS-sha256.txt stage/
          ls -la stage/
      - name: Upload binaries + checksums (run artifacts for the attest + publish jobs)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pqscan-dist
          path: stage
          retention-days: 7

  attest:
    name: SLSA provenance (every artifact)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pqscan-dist
          path: dist
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        # one glob pattern: the multiline subject-path form is passed to the
        # action as ONE literal path (newlines unexpanded) and finds nothing
        # (dispatch 38735245438) — this glob matches all five binaries,
        # the windows .exe included
        with:
          subject-path: dist/pqscan-*

  publish:
    name: gate pre-flight + GitHub release
    runs-on: ubuntu-latest
    needs: [build, attest]
    if: github.event.inputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Ref guard — publish dispatches come from the signed tag only
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) : ;;
            *) echo "::error::publish=true must be dispatched from the signed tag ref (got $GITHUB_REF)"; exit 1 ;;
          esac
      - name: Release gate (pre-flight; runner mode — signatures verified at the cut machine)
        env:
          PQSCAN_GATE_SKIP_TAG_VERIFY: '1'
        run: scripts/check_release_consistency.sh "${{ inputs.version }}"
      - name: Download binaries + checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pqscan-dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          notes="docs/release-notes-${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::release notes missing for ${version}: create ${notes}"
            exit 1
          fi
          test -f dist/CHECKSUMS-sha256.txt || { echo "::error::checksums artifact missing"; exit 1; }
          gh release create "$version" \
            -R "$GITHUB_REPOSITORY" \
            --title "pqscan ${version}" \
            --notes-file "$notes" \
            dist/pqscan-linux-* dist/pqscan-darwin-* dist/pqscan-windows-* dist/CHECKSUMS-sha256.txt
